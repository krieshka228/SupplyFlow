name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SupplyFlow.sln
      - name: Build
        run: dotnet build SupplyFlow.sln --no-restore
      - name: Test
        run: dotnet test SupplyFlow.sln --no-build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web image
        run: docker build -f Dockerfile.web -t supplyflow-web:ci .
      - name: Build API image
        run: docker build -f Dockerfile.api -t supplyflow-api:ci .
