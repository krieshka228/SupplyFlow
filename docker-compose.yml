services:
  postgres:
    image: postgres:16-alpine
    container_name: supplyflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplyflow
    ports:
      - "5433:5432"
    volumes:
      - supplyflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplyflow-postgres-data:
